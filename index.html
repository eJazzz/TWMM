<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transworld Medical Management | Assess. Fix. Govern.</title>
    <meta name="description" content="Professional consulting for outpatient clinics. Operations, HIPAA compliance, and revenue cycle governance for 1-20 provider practices." />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              clinical: {
                deep: '#102A43',
                slate: '#334E68',
                blue: '#243B53',
                accent: '#627D98',
                light: '#F0F4F8',
                gold: '#B6922E'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Playfair Display', 'serif']
            }
          }
        }
      }
    </script>

    <style>
      .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(226, 232, 240, 0.8);
      }
      .hover-lift {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .hover-lift:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body class="bg-clinical-light text-clinical-deep antialiased">
    <div id="root"></div>
    
    <script type="module" src="index.tsx"></script>
  </body>
</html>

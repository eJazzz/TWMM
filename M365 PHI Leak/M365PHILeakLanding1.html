<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transworld Medical - M365 Audit</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel to translate JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .scroll-smooth { scroll-behavior: smooth; }
        i[data-lucide] { display: inline-block; vertical-align: middle; }
    </style>
</head>
<body class="scroll-smooth">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // CONFIGURATION
        const BOOKING_URL = "https://calendly.com/admin-transworldmm/30min";

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const APP_NAME = "TRANSWORLD MEDICAL";
        const SUB_NAME = "MANAGEMENT";

        const App = () => {
            const [darkMode, setDarkMode] = useState(false);
            const [showScrollTop, setShowScrollTop] = useState(false);
            const [imageLoaded, setImageLoaded] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setShowScrollTop(window.scrollY > 400);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToSection = (id) => {
                const element = document.getElementById(id);
                if (element) element.scrollIntoView({ behavior: 'smooth' });
            };

            const scrollToTop = () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleBooking = () => {
                window.location.href = BOOKING_URL;
            };

            return (
                <div className={`min-h-screen transition-colors duration-300 ${darkMode ? 'bg-[#0a1128] text-white' : 'bg-slate-50 text-slate-900'}`}>
                    
                    {/* 1. Urgency Banner */}
                    <div className="bg-[#b91c1c] text-white py-2.5 px-4 text-center text-[10px] md:text-[11px] font-black uppercase tracking-[0.25em] flex items-center justify-center gap-3">
                        <span>⚠️ 2026 AUDIT CYCLE ACTIVE: COMPLIANCE ENFORCEMENT ACTIVE ⚠️</span>
                    </div>

                    {/* 2. Navigation */}
                    <nav className={`sticky top-0 w-full z-50 border-b backdrop-blur-md transition-colors ${darkMode ? 'bg-[#0a1128]/95 border-white/5' : 'bg-white/95 border-slate-200'}`}>
                        <div className="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-4 text-left">
                                {/* TWMM Logo Container */}
                                <div className="w-12 h-12 relative flex items-center justify-center">
                                    {!imageLoaded && (
                                        <div className="absolute inset-0 flex items-center justify-center p-1 border-2" style={{ borderColor: darkMode ? '#c5a059' : '#1e3a8a' }}>
                                            <Icon name="shield" className={darkMode ? 'text-[#c5a059]' : 'text-blue-900'} />
                                        </div>
                                    )}
                                    <img 
                                        src="TWMMMinLogo_Trnsprnt_200x200px.png" 
                                        alt="TWMM Logo" 
                                        className={`w-full h-full object-contain ${imageLoaded ? 'opacity-100' : 'opacity-0'}`}
                                        onLoad={() => setImageLoaded(true)}
                                    />
                                </div>
                                <div className="flex flex-col">
                                    <span className="font-black text-lg tracking-tighter leading-none">{APP_NAME}</span>
                                    <span className={`text-[9px] tracking-[0.4em] font-bold ${darkMode ? 'text-[#c5a059]' : 'text-slate-500'}`}>{SUB_NAME}</span>
                                </div>
                            </div>
                            
                            <div className="hidden md:flex items-center gap-4 lg:gap-8 text-[10px] lg:text-[11px] font-bold uppercase tracking-[0.1em] lg:tracking-[0.2em]">
                                <button onClick={() => scrollToSection('why')} className="hover:text-[#c5a059] transition-colors">Risk Profile</button>
                                <button onClick={() => scrollToSection('scope')} className="hover:text-[#c5a059] transition-colors">Audit Scope</button>
                                <button onClick={() => scrollToSection('process')} className="hover:text-[#c5a059] transition-colors">Process</button>
                                <button onClick={() => setDarkMode(!darkMode)} className={`p-2 rounded-md border ${darkMode ? 'border-white/10 text-yellow-500' : 'border-slate-200 text-slate-600'}`}>
                                    {darkMode ? "☀️" : "🌙"}
                                </button>
                                <button onClick={handleBooking} className="bg-[#c5a059] hover:bg-[#b08d48] text-[#0a1128] px-4 lg:px-6 py-2 lg:py-3 font-black transition-all shadow-lg whitespace-nowrap active:scale-95">
                                    BOOK AUDIT NOW
                                </button>
                            </div>

                            <div className="md:hidden flex items-center gap-2">
                                <button onClick={() => setDarkMode(!darkMode)} className="p-2">
                                    {darkMode ? "☀️" : "🌙"}
                                </button>
                            </div>
                        </div>
                    </nav>

                    {/* 3. Hero Section */}
                    <section className="relative pt-16 md:pt-24 pb-16 md:pb-24 px-4 overflow-hidden text-center">
                        <div className="max-w-5xl mx-auto">
                            <div className="inline-block bg-[#b91c1c]/10 border border-[#b91c1c]/30 text-[#ff4d4d] px-4 py-2 text-xs md:text-sm font-black uppercase tracking-[0.1em] md:tracking-[0.2em] mb-8">
                                One hour of expert oversight can prevent a six-figure HIPAA penalty.
                            </div>
                            <h1 className="text-4xl md:text-6xl lg:text-8xl font-black mb-8 tracking-tighter leading-[0.95]">
                                Stop Accidental PHI Leaks in <br /><span className="text-[#c5a059]">Microsoft 365.</span>
                            </h1>
                            <p className={`text-lg md:text-xl lg:text-2xl max-w-3xl mx-auto mb-12 leading-relaxed font-medium ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>
                                Most clinics use M365 with default settings that leave patient data exposed.<br /> Our 60-minute remote audit identifies your top risks and gives you a prioritized fix list.
                            </p>
                            <div className="flex flex-col sm:flex-row gap-4 justify-center">
                                <button onClick={handleBooking} className="bg-[#c5a059] hover:bg-[#b08d48] text-[#0a1128] px-8 py-4 md:px-10 md:py-5 rounded-sm text-lg font-black shadow-2xl transition-all active:scale-95">
                                    BOOK M365 LEAK CHECK ($199)
                                </button>
                                <button 
                                    onClick={() => scrollToSection('scope')}
                                    className={`px-8 py-4 md:px-10 md:py-5 rounded-sm text-lg font-black border transition-all ${darkMode ? 'border-white/10 hover:bg-white/5' : 'border-slate-200 hover:bg-slate-50 text-slate-600'}`}
                                >
                                    What's Included & What's Not
                                </button>
                            </div>
                            <div className="mt-16 opacity-40 uppercase tracking-[0.3em] font-black text-xs md:text-sm">
                                Serving Tampa Bay Medical Corridor
                            </div>
                        </div>
                    </section>

                    {/* 4. Why Critical Section */}
                    <section id="why" className={`py-20 md:py-24 px-4 ${darkMode ? 'bg-[#0d1633] border-y border-white/5' : 'bg-slate-100 border-y border-slate-200'}`}>
                        <div className="max-w-6xl mx-auto text-center">
                            <h2 className="text-3xl md:text-4xl font-black mb-4 uppercase tracking-tighter italic">Why M365 PHI Leak Audit is Critical</h2>
                            <div className="h-1 w-20 bg-[#c5a059] mx-auto mb-16"></div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8 md:gap-10 text-left">
                                {[
                                    { icon: "share-2", title: "Overshared Files", desc: "Default settings allow 'Anyone with the link' access, making patient folders indexable by search engines." },
                                    { icon: "users", title: "Guest Access Bloat", desc: "Former vendors often retain high-level access to your SharePoint environment indefinitely." },
                                    { icon: "mail", title: "Hidden Forwarding", desc: "Malicious rules can send copies of clinical emails to external accounts undetected." }
                                ].map((risk, i) => (
                                    <div key={i} className={`p-8 md:p-10 border-t-4 border-[#b91c1c] ${darkMode ? 'bg-[#121d3a]' : 'bg-white shadow-sm'}`}>
                                        <div className="w-12 h-12 bg-[#b91c1c]/10 flex items-center justify-center mb-6 md:mb-8">
                                            <Icon name={risk.icon} className="text-[#b91c1c]" />
                                        </div>
                                        <h4 className="text-xl font-black uppercase tracking-tight mb-4 leading-none">{risk.title}</h4>
                                        <p className="text-sm opacity-70 leading-relaxed">{risk.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* 5. Audit Scope Section */}
                    <section id="scope" className="py-20 md:py-24 px-4 max-w-6xl mx-auto">
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 md:gap-20 items-center">
                            <div className="text-left">
                                <h2 className="text-3xl md:text-4xl font-black mb-8 uppercase tracking-tighter italic text-[#c5a059]">The 60-Minute Product</h2>
                                <p className="text-lg md:text-xl mb-10 font-medium opacity-70 leading-relaxed">We focus on the technical gaps that lead directly to HIPAA breaches.</p>
                                <div className="space-y-6">
                                    {[
                                        { label: "Identity & MFA Audit", desc: "Admin role review and MFA enforcement validation." },
                                        { label: "SharePoint External Audit", desc: "Detection of 'Anyone' links and link expirations." },
                                        { label: "Teams Security Review", desc: "Guest chat and recording storage check." }
                                    ].map((item, i) => (
                                        <div key={i} className="flex gap-5">
                                            <div className="bg-green-500/20 p-2 rounded-sm shrink-0 h-fit"><Icon name="check-circle" size={16} className="text-green-500" /></div>
                                            <div>
                                                <h5 className="font-black text-xs uppercase tracking-[0.15em]">{item.label}</h5>
                                                <p className="text-sm opacity-60 leading-relaxed">{item.desc}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className={`p-8 md:p-10 border-b-8 border-[#c5a059] shadow-2xl ${darkMode ? 'bg-[#121d3a]' : 'bg-white'}`}>
                                <h3 className="text-2xl font-black uppercase mb-8 flex items-center gap-3">
                                    <span className="text-[#b91c1c]">⚠️</span> Important: Out of Scope
                                </h3>
                                <ul className="space-y-5 text-sm font-bold uppercase tracking-tight opacity-70">
                                    <li className="flex gap-2"><span>✖</span> A full 200-point HIPAA audit.</li>
                                    <li className="flex gap-2"><span>✖</span> Legal advice or certification.</li>
                                    <li className="flex gap-2"><span>✖</span> Policy writing or staff training.</li>
                                </ul>
                            </div>
                        </div>
                    </section>

                    {/* 8. Pricing CTA Section */}
                    <section className="py-20 md:py-24 px-4 bg-[#b91c1c] text-white text-center">
                        <div className="max-w-4xl mx-auto">
                            <h2 className="text-4xl md:text-6xl font-black mb-8 uppercase tracking-tighter italic">Ready to Audit?</h2>
                            <div className="text-6xl md:text-7xl font-black mb-8 leading-none">$199</div>
                            <p className="text-lg md:text-xl lg:text-2xl font-medium mb-12 opacity-90 max-w-2xl mx-auto">One hour of expert oversight can prevent a six-figure HIPAA penalty.</p>
                            <button onClick={handleBooking} className="bg-white text-[#b91c1c] hover:bg-slate-100 px-8 py-4 md:px-12 md:py-6 rounded-sm text-lg md:text-xl font-black shadow-2xl uppercase tracking-tight transition-transform active:scale-95">
                                BOOK YOUR SESSION NOW
                            </button>
                        </div>
                    </section>

                    {/* 10. Scroll to Top Button */}
                    {showScrollTop && (
                        <button onClick={scrollToTop} className={`fixed bottom-6 right-6 md:bottom-8 md:right-8 p-3 md:p-4 rounded-full shadow-2xl z-50 transition-transform hover:scale-110 active:scale-90 ${darkMode ? 'bg-[#c5a059] text-[#0a1128]' : 'bg-[#0a1128] text-white'}`}>
                            ↑
                        </button>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
